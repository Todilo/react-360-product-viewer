name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify package before release
        run: npm test

      - name: Create release PR or publish package
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          version-script: npm run version-packages
          pr-title: "chore: release package"
          commit-message: "chore: release package"
          github-token: ${{ secrets.GITHUB_TOKEN }}
